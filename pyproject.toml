[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-vectorbt-engine"
version = "1.0.0"
description = "A-Share Enhanced High-Throughput Vectorized Backtesting Engine with Numba JIT Microstructural Constraints"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Quantitative Platform Team", email = "research@quant-platform.org"}
]
dependencies = [
    "numpy>=1.23,<2.6",
    "pandas>=2.0,<3.0",
    "numba>=0.60",
    "pydantic>=2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
